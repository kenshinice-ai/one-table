<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, 'PingFang SC', sans-serif">
  <!--
    Sample Asian Grocer · store plan. Fictional layout, brand-style schematic.

    The grid a real store would replace: fresh departments around the
    perimeter (A), gondola aisles down the middle (B), frozen and checkout
    along the bottom (C). Aisle codes are drawn here and repeated in
    venue.json, so a real store swaps this file plus the coordinates and
    nothing else changes.

    Walkways are left clear at y≈128, y≈386 and x≈172/632 — the route line is
    drawn between stop coordinates, so those points sit in the walkway rather
    than inside a department block.
  -->
  <rect width="800" height="500" fill="#fcfaf5"/>
  <rect x="12" y="12" width="776" height="476" rx="18" fill="none" stroke="#e8ded1" stroke-width="2"/>

  <!-- walkway ring: a guide, not a slab — the route line is drawn over it -->
  <path d="M172 128 H632 V386 H150" fill="none" stroke="#efe7da" stroke-width="26"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.75"/>

  <!-- entrance -->
  <path d="M40 448 L14 448" stroke="#77746d" stroke-width="3"/>
  <text x="30" y="436" text-anchor="middle" fill="#77746d" font-size="11" letter-spacing="1">IN</text>

  <g stroke="#cfc4b4" stroke-width="1.6" fill="#fff">
    <!-- A1 produce, left band -->
    <rect x="40" y="150" width="112" height="220" rx="10"/>
    <!-- A2 meat, top left -->
    <rect x="192" y="40" width="216" height="66" rx="10"/>
    <!-- A3 seafood, top right -->
    <rect x="432" y="40" width="216" height="66" rx="10"/>
    <!-- A4 dairy, right band -->
    <rect x="652" y="150" width="108" height="220" rx="10"/>
    <!-- B gondolas -->
    <rect x="212" y="160" width="76" height="200" rx="8"/>
    <rect x="352" y="160" width="76" height="200" rx="8"/>
    <rect x="492" y="160" width="76" height="200" rx="8"/>
    <!-- C1 frozen -->
    <rect x="600" y="404" width="160" height="60" rx="10"/>
    <!-- checkout -->
    <rect x="52" y="404" width="180" height="60" rx="10"/>
  </g>

  <!-- department codes -->
  <g fill="#b0472a" font-size="19" font-weight="700" text-anchor="middle">
    <text x="96" y="246">A1</text>
    <text x="300" y="68">A2</text>
    <text x="540" y="68">A3</text>
    <text x="706" y="246">A4</text>
    <text x="250" y="236">B1</text>
    <text x="390" y="236">B2</text>
    <text x="530" y="236">B3</text>
    <text x="680" y="430">C1</text>
  </g>

  <!-- department names -->
  <g fill="#4f4b45" font-size="13" text-anchor="middle">
    <text x="96" y="268">蔬果生鲜</text>
    <text x="96" y="286" font-size="11" fill="#8d8578">Produce</text>
    <text x="300" y="88">肉档 Meat</text>
    <text x="540" y="88">海鲜档 Seafood</text>
    <text x="706" y="268">乳品烘焙</text>
    <text x="706" y="286" font-size="11" fill="#8d8578">Dairy</text>
    <text x="680" y="450" font-size="12">冷冻 Frozen</text>
    <text x="142" y="432" font-size="13">收银 · 服务台</text>
    <text x="142" y="450" font-size="11" fill="#8d8578">Checkout &amp; Service</text>
  </g>

  <!-- gondola contents, set vertically down each aisle -->
  <g fill="#6d675e" font-size="12" text-anchor="middle">
    <text x="250" y="262">米面粮油</text>
    <text x="250" y="280" font-size="10" fill="#8d8578">Rice · Oil</text>
    <text x="390" y="262">干货酱料</text>
    <text x="390" y="280" font-size="10" fill="#8d8578">Sauces</text>
    <text x="530" y="262">零食饮品</text>
    <text x="530" y="280" font-size="10" fill="#8d8578">Snacks</text>
  </g>

  <text x="400" y="486" text-anchor="middle" fill="#b9ad9c" font-size="11" letter-spacing="3">SAMPLE ASIAN GROCER · SCHEMATIC</text>
</svg>
