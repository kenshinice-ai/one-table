<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, 'PingFang SC', sans-serif">
  <!-- Sample Centre · Level 1. Fictional venue, brand-style schematic. -->
  <rect width="800" height="500" fill="#fcfaf5"/>
  <rect x="12" y="12" width="776" height="476" rx="18" fill="none" stroke="#e8ded1" stroke-width="2"/>

  <rect x="40" y="205" width="720" height="90" rx="12" fill="#f7f4ed"/>
  <text x="400" y="255" text-anchor="middle" fill="#b9ad9c" font-size="13" letter-spacing="4">WALKWAY</text>

  <!-- escalator from G -->
  <rect x="46" y="216" width="70" height="68" rx="10" fill="#fff" stroke="#77746d" stroke-width="1.6"/>
  <text x="81" y="244" text-anchor="middle" fill="#4f4b45" font-size="10">Escalator</text>
  <text x="81" y="260" text-anchor="middle" fill="#8d8578" font-size="10">↑ from G</text>

  <!-- top row -->
  <g stroke-width="1.8">
    <rect x="110" y="60" width="185" height="130" rx="12" fill="#eef4ef" stroke="#5a947e"/>
    <text x="202" y="120" text-anchor="middle" fill="#33745e" font-size="15" font-weight="600">Wholegrain Health</text>
    <text x="202" y="140" text-anchor="middle" fill="#5a947e" font-size="11">健康食品</text>

    <rect x="355" y="60" width="185" height="130" rx="12" fill="#f4eef5" stroke="#8f6d9b"/>
    <text x="447" y="120" text-anchor="middle" fill="#6d4f79" font-size="15" font-weight="600">Cellar Door Liquor</text>
    <text x="447" y="140" text-anchor="middle" fill="#8f6d9b" font-size="11">酒商</text>

    <rect x="570" y="60" width="180" height="130" rx="12" fill="#f5efe9" stroke="#a08469"/>
    <text x="660" y="120" text-anchor="middle" fill="#7c6449" font-size="15" font-weight="600">The Kitchen Shop</text>
    <text x="660" y="140" text-anchor="middle" fill="#a08469" font-size="11">厨具店</text>
  </g>

  <!-- dining row -->
  <g stroke-width="1.8">
    <rect x="125" y="310" width="185" height="130" rx="12" fill="#fdf1ea" stroke="#d96b45"/>
    <text x="218" y="366" text-anchor="middle" fill="#b94d2c" font-size="15" font-weight="600">Golden Wok</text>
    <text x="218" y="386" text-anchor="middle" fill="#d96b45" font-size="11">金镬中餐厅</text>

    <rect x="355" y="310" width="185" height="130" rx="12" fill="#f8f1e4" stroke="#c39951"/>
    <text x="447" y="366" text-anchor="middle" fill="#96742f" font-size="15" font-weight="600">Trattoria Sole</text>
    <text x="447" y="386" text-anchor="middle" fill="#c39951" font-size="11">阳光意面馆</text>

    <rect x="575" y="310" width="180" height="130" rx="12" fill="#edf3f5" stroke="#6d94a3"/>
    <text x="665" y="366" text-anchor="middle" fill="#48707f" font-size="15" font-weight="600">Izakaya Hana</text>
    <text x="665" y="386" text-anchor="middle" fill="#6d94a3" font-size="11">花居酒屋</text>
  </g>

  <text x="770" y="480" text-anchor="end" fill="#b9ad9c" font-size="10" letter-spacing="2">SAMPLE CENTRE · LEVEL 1</text>
</svg>
